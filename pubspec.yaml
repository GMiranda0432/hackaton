
name: bem_te_ver
description: "Aplicativo de gestão de consultórios de psicologia e psiquiatria."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-hackaton.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo-hackaton.png"
